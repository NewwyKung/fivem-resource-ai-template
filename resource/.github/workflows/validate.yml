name: Validate template

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.repository == 'NewwyKung/FiveM-Resource-AI-AGENTS-Template' ||
      github.repository == 'NewwyKung/fivem-resource-ai-template'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: resource/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix resource/ui --no-audit --no-fund

      - name: Validate repository
        run: npm run validate

      - name: Install pinned LuaLS outside the workspace
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('tooling.config.json', 'utf8')).luaLanguageServer.version")"
          INSTALL_DIR="$RUNNER_TEMP/luals"
          mkdir -p "$INSTALL_DIR"
          curl --fail --location --silent --show-error \
            "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$INSTALL_DIR"
          echo "LUALS_BIN=$INSTALL_DIR/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Run Lua diagnostics
        run: npm run check:lua
